data_root: classification/data/original_patches
class_names:
- Cloudy
- Obstructed
- Partial visibility
- unknown bright area
- Visible
output_dir: outputs/classification
seed: 42
model_name: resnet50
pretrained: true
dropout: 0.5
num_classes: 5
epochs: 30
batch_size: 512
lr: 0.0005
weight_decay: 0.001
label_smoothing: 0.1
warmup_epochs: 5
grad_accum_steps: 1
amp: true
num_workers: 0
image_size: 56
rotation_limit: 15.0
augment_train: true
val_ratio: 0.2
test_ratio: 0.2
split_group: group_id
early_stop_patience: 20
threshold_metric: f1_macro
focal_gamma: 0.0
mixup_alpha: 0.1
minority_enhance: false
minority_classes: [2, 3]
minority_ratio_threshold: 0.1
use_ema: true
ema_decay: 0.999
