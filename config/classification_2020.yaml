data_root: data/classification_2020/original_patches
class_names:
- Cloudy
- Obstructed
- Partial visibility
- unknown bright area
- Visible
output_dir: outputs/classification_2020
seed: 42
model_name: resnet50
pretrained: true
dropout: 0.5
num_classes: 5
epochs: 80
batch_size: 256
lr: 0.0005
weight_decay: 0.001
label_smoothing: 0.1
warmup_epochs: 3
grad_accum_steps: 1
amp: true
num_workers: 0
image_size: 56
rotation_limit: 15.0
augment_train: true
val_ratio: 0.15
test_ratio: 0.15
split_group: group_id
early_stop_patience: 20
threshold_metric: f1_macro
focal_gamma: 2.5
mixup_alpha: 0.1
minority_enhance: true
minority_classes:
- 2
- 3
minority_ratio_threshold: 0.1
